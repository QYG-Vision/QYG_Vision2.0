# enemy_color: "red"
enemy_color: "blue"

#####-----神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
device: "AUTO:GPU,CPU,NPU"
min_confidence: 0.8
use_traditional: true

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----传统方法参数-----#####
threshold: 100
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree
min_confidence: 0.8

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75
max_match_distance: 0.5 #F预测装甲板与观测装甲板的最大距离差(m)
max_match_yaw_diff: 0.7 # EkF预测装甲板与观测装甲板的最大yaw差(rad)
armor_switch_confirm_frames: 3 # 同一候选物理板连续出现多少帧后才提交切板，最小为1
# 控制输入安全门控：只阻止异常状态进入 Planner，不重置 EKF 或修改 TX 协议
control_max_linear_speed_mps: 8.0 # EKF中心平移速度上限(m/s)
control_max_angular_speed_radps: 12.0 # EKF目标自转角速度上限(rad/s)
control_max_recent_nis_fail_rate: 0.5 # NIS近期拒绝比例上限[0,1]
tuoluo_enter_speed_radps: 2.0 # 连续高于该角速度后进入小陀螺
tuoluo_exit_speed_radps: 1.5 # 连续低于该角速度后退出小陀螺，和进入阈值形成滞回
tuoluo_enter_duration_s: 0.1
tuoluo_exit_duration_s: 0.3
tuoluo_filter_alpha: 0.3 # w一阶低通系数，越小越平滑

#####-----aimer参数-----#####
yaw_offset: 0 # degree -2.5
pitch_offset: 4 # degree 3
comming_angle: 60 # degree
leaving_angle: 20 # degree
decision_speed: 8 # rad/s
high_speed_delay_time: 0.015 # s
low_speed_delay_time: 0.015 # s

#####-----planner参数(补)-----#####
planner_disable_prediction: true # false: 按子弹飞行时间预测目标位置；true: 仅用于关闭预测的对照实验
fire_thresh: 0.003   # 开火阈值(rad): 预测时刻的yaw/pitch误差范数小于该值才允许开火
max_yaw_acc: 150      # yaw角加速度上限(rad/s^2): 越大跟随更激进，越小更平滑
Q_yaw: [9e6, 0]      # yaw状态权重[角度误差, 角速度误差]: 第一项越大越“咬角度”
R_yaw: [1]           # yaw控制权重: 越大越抑制大动作，越小响应更快
max_pitch_acc: 100   # pitch角加速度上限(rad/s^2): 限制俯仰通道控制激烈程度
Q_pitch: [9e6, 0]    # pitch状态权重[角度误差, 角速度误差]
R_pitch: [1]         # pitch控制权重

#####-----shooter参数-----#####
first_tolerance: 3 # 近距离射击容差，degree
second_tolerance: 2 # 远距离射击容差，degree
judge_distance: 2 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

#####-----camera参数-----#####
camera_name: "hikrobot_gige"
exposure_ms: 3.0
gain: 1.0

#  1  0  0
#  0  1  0
#  0  0  1
R_gimbal2imubody: [1, 0, 0, 0, 1, 0,  0, 0, 1]


# 重投影误差: 0.0655px #8.14标定
camera_matrix: [1341.697749011696, 0, 800.27204574447001, 0, 1341.1552010517823, 628.38616423382359, 0, 0, 1]
distort_coeffs: [-0.13220321467643859, 0.12409054584558868, -0.00031848541402000683, -0.00025654170254845392, 0]

# 相机同理想情况的偏角
#  0  0  1
#  -1  0  0
#  0  -1  0
# 相机同理想情况的偏角: yaw0.47 pitch-0.37 roll-2.10 degree #8.14标定
R_camera2gimbal: [0.0065194329928004446, -0.036715868482419235, 0.99930447912287168, -0.99994493319033062, 0.0079788649731888928, 0.0068167661485901863, -0.0082235989954112746, -0.99929389206345154, -0.036661828981126465]
t_camera2gimbal: [0.11788009429761802, -0.0012824677328573274, 0.059952851426194366]

#####-----cboard参数-----#####
cboard_com_port: "/dev/gimbal"
cboard_baudrate: 921600
cboard_default_bullet_speed: 23.0
feedback_log_interval_ms: 200 # --feedback 的 Planner/TX/RX 日志间隔；不改变串口收发频率
imu_feedback_timeout_ms: 100 # 超过该时间未收到新IMU数据时，停止跟踪和控制
# 图像接收时间戳对应的 IMU 查询偏移：query_time = image_timestamp + delay。
# -55600 us 表示图像内容约比主机收到图像的时刻早 55.6 ms；它只做时间对齐，
# 不要与 aimer 的 high/low_speed_delay_time（目标/弹道前向预测）相加或互相替代。
gimbal_feedback_delay_us: -55600


#####-----buff_detector参数-----#####
model: "assets/yolov5.xml"

#####-----buff_aimer参数-----#####
fire_gap_time: 0.520   # s
predict_time: 0.100     # s
