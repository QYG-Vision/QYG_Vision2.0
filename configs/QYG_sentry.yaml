# enemy_color: "red"
enemy_color: "blue"


#####-----神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
device: "AUTO:NPU" 
min_confidence: 0.7
use_traditional: true

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----USB相机参数-----#####
# image_width: 1280
# image_height: 720
# fov_h: 57.7 #87.7
# fov_v: 56.7 
# new_fov_h: 27 #67
# new_fov_v: 40.9
# usb_frame_rate: 120
# usb_exposure: 500 #1-80000______250
# usb_gamma: 160
# usb_gain: 10 #0-96

#####-----工业相机参数-----#####
camera_name: "hikrobot"
#exposure_ms: 0.8
exposure_ms: 10
gain: 10
vid_pid: "2bdf:0001"
# camera_name: "hikrobot_gige"
# exposure_ms: 0.8
# gain: 16.9

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree
min_confidence: 0.8

#####-----gimbalk（串口）参数-----#####
com_port: "/dev/gimbal"
fixed_cmd_vel_angular_z: 10

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 25
outpost_max_temp_lost_count: 75

#####-----EKF参数-----#####
ekf_v1: 3.0      # 普通机器人加速度方差 (m^2/s^4)
ekf_v2: 40.0     # 普通机器人角加速度方差 (rad^2/s^4)
ekf_v1_outpost: 10    # 前哨站加速度方差
ekf_v2_outpost: 0.1   # 前哨站角加速度方差
ekf_r_yaw: 0.05       # yaw 观测噪声方差
ekf_r_pitch: 0.05     # pitch 观测噪声方差
ekf_r_distance: 0.5   # 距离观测噪声方差
ekf_r_angle: 0.8      # 装甲板角度观测噪声方差

#####-----aimer参数-----#####还需要校准，校准这个offset的参数
yaw_offset: 0 # degree -2.5
pitch_offset: 0  # degree 2
comming_angle: 60 # degree
leaving_angle: 20 # degree
left_yaw_offset: -1
right_yaw_offset: -0.6
decision_speed: 10 # rad/s
high_speed_delay_time: 0.026 # s
low_speed_delay_time: 0.030 # s


#####-----planner-----#####
fire_thresh: 0.003

max_yaw_acc: 50
Q_yaw: [9e5, 0]
R_yaw: [0.1]

max_pitch_acc: 50
Q_pitch: [9e5, 100]
R_pitch: [1.0]

#####-----shooter参数-----#####
first_tolerance: 5 # 近距离射击容差，degree
second_tolerance: 2 # 远距离射击容差，degree
judge_distance: 3 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

#####-----decider参数-----#####
mode: 1

#####-----工业相机标定参数-----#####
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]


